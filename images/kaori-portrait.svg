<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5f9"/>
      <stop offset="1" stop-color="#ffdce8"/>
    </linearGradient>
    <linearGradient id="vio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c89a6d"/>
      <stop offset="1" stop-color="#8b5a3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 卡片底 -->
  <rect width="300" height="400" rx="24" fill="url(#bg)"/>
  <ellipse cx="150" cy="150" rx="118" ry="120" fill="url(#glow)"/>

  <!-- 樱花花瓣点缀 -->
  <g fill="#ff8fb0">
    <path d="M36 42 C33 34 41 30 44 36 C45.6 40.4 39 45 36 42 Z"/>
    <path d="M252 62 C249 54 257 50 260 56 C261.6 60.4 255 65 252 62 Z"/>
    <path d="M42 344 C39 336 47 332 50 338 C51.6 342.4 45 347 42 344 Z"/>
    <path d="M266 322 C263 314 271 310 274 316 C275.6 320.4 269 325 266 322 Z"/>
  </g>
  <g fill="#ffb8d0">
    <path d="M64 96 C61.5 89.5 68.5 86.5 70.5 92 C71.6 95.2 66.4 98.6 64 96 Z"/>
    <path d="M232 110 C229.5 103.5 236.5 100.5 238.5 106 C239.6 109.2 234.4 112.6 232 110 Z"/>
  </g>

  <!-- 小提琴 -->
  <g transform="translate(150 168)">
    <path d="M0 34 C-34 25 -43 45 -34 59 C-27 69 -9 71 0 59 C9 71 27 69 34 59 C43 45 34 25 0 34 Z"
          fill="url(#vio)" stroke="#6b4226" stroke-width="2.5"/>
    <rect x="-4" y="-34" width="8" height="70" rx="2.5" fill="#6b4226"/>
    <circle cx="0" cy="-37" r="9" fill="#6b4226"/>
    <circle cx="-14" cy="-44" r="3.5" fill="#6b4226"/>
    <circle cx="14" cy="-44" r="3.5" fill="#6b4226"/>
    <path d="M-18 -14 Q-12 -25 -6 -14" fill="none" stroke="#4a2e1e" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M6 -14 Q12 -25 18 -14" fill="none" stroke="#4a2e1e" stroke-width="2.8" stroke-linecap="round"/>
    <g stroke="#f7ecf0" stroke-width="1.6" stroke-linecap="round">
      <line x1="-2" y1="-28" x2="-2" y2="52"/>
      <line x1="0" y1="-28" x2="0" y2="55"/>
      <line x1="2" y1="-28" x2="2" y2="52"/>
    </g>
    <!-- 琴弓 -->
    <line x1="-66" y1="14" x2="66" y2="-20" stroke="#8b5a3c" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-63" y1="16" x2="63" y2="-18" stroke="#f2e3e8" stroke-width="1.4"/>
  </g>

  <!-- 音符 -->
  <g fill="#e0467c">
    <path d="M98 132 L98 96 Q101 98 104 97 Q110 95 110 100 Q110 105 105 106 L101 107 L101 132 Z"/>
    <circle cx="95" cy="132" r="6.5"/>
    <path d="M196 108 L196 72 Q199 74 202 73 Q208 71 208 76 Q208 81 203 82 L199 83 L199 108 Z"/>
    <circle cx="193" cy="108" r="6.5"/>
  </g>
  <g fill="#ff8fb0">
    <path d="M208 136 L208 116 Q210 117.5 212 117 Q216 116 216 119 Q216 122 213 122.6 L210 123.2 L210 136 Z"/>
    <circle cx="207" cy="136" r="3.6"/>
  </g>

  <!-- 标题 -->
  <text x="150" y="338" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Songti SC', serif"
        font-size="31" font-style="italic" fill="#e0467c">四月は君の嘘</text>
  <text x="150" y="366" text-anchor="middle"
        font-family="system-ui, 'Segoe UI', sans-serif"
        font-size="14" letter-spacing="2" fill="#b08fa0">Kaori Miyazono</text>
